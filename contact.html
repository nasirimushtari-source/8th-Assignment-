<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Contact Us</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>

<body>

<div class="container my-5" id="contact">

  <h2>Contact Us</h2>

  <p>If you have any questions, send us a message.</p>

  <div class="row">

    <div class="col-md-6">

      <form onsubmit="return validateContact()">

        <input type="text" id="cname" class="form-control mb-2" placeholder="Name">

        <input type="email" id="cemail" class="form-control mb-2" placeholder="Email">

        <textarea id="cmessage" class="form-control mb-2" placeholder="Message"></textarea>

        <button class="btn btn-primary w-100">Send</button>

      </form>

    </div>

    <div class="col-md-6">
      <div class="p-3 bg-light rounded">
        <h5>Info</h5>
        <p>📍 Tehran</p>
        <p>📞 +98 345 133 098</p>
        <p>📧 shop@email.com</p>
      </div>
    </div>

  </div>

  <a href="index.html" class="btn btn-dark mt-3">Back Home</a>

</div>

<script src="script.js"></script>
</body>
</html>
